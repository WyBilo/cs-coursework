<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Website Registration</title>
</head>

<body>
    <h1>Website Registration</h1>

    <form method="get">
        <p>
            <label for="first-name">First name:</label>
            <input type="text" id="first-name" name="firstName" required>
        </p>

        <p>
            <label for="last-name">Last name:</label>
            <input type="text" id="last-name" name="lastName" required>
        </p>

        <p>
            <label for="email">Email address:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <details>
            <summary>Optional Survey</summary>
            <p>
                <label for="college-year">What is your year in college?</label>
                <select id="college-year" name="collegeYear">
                    <option value="">Select your year (optional)</option>
                    <option value="freshman">Freshman</option>
                    <option value="sophomore">Sophomore</option>
                    <option value="junior">Junior</option>
                    <option value="senior">Senior</option>
                    <option value="graduate">Graduate student</option>
                    <option value="other">Other</option>
                </select>
            </p>
        </details>

        <p>
            <button type="submit">Register</button>
        </p>
    </form>
</body>

</html>
