<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Arithmetic Calculator</title>
    <script>
        var firstNumber;
        var secondNumber;
        var number1;
        var number2;

        firstNumber = window.prompt("Enter the first number:");
        secondNumber = window.prompt("Enter the second number:");

        number1 = parseFloat(firstNumber);
        number2 = parseFloat(secondNumber);

        document.writeln("<h1>Arithmetic Results</h1>");
        document.writeln("<p>Sum: " + (number1 + number2) + "</p>");
        document.writeln("<p>Product: " + (number1 * number2) + "</p>");
        document.writeln("<p>Difference: " + (number1 - number2) + "</p>");

        if (number2 !== 0) {
            document.writeln("<p>Quotient: " + (number1 / number2) + "</p>");
        } else {
            document.writeln("<p>Quotient: Cannot divide by zero.</p>");
        }
    </script>
</head>

<body></body>

</html>
